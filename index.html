<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visor 3D · Jezero</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #c9a27e; }
    #lienzo { display: block; width: 100%; height: 100%; }

    /* ---- Panel de controles ---- */
    #panel {
      position: absolute; top: 12px; left: 12px; width: 230px;
      background: rgba(30, 20, 15, 0.78); color: #f3e6d8;
      font: 13px/1.4 system-ui, sans-serif;
      border-radius: 8px; padding: 10px 12px;
      backdrop-filter: blur(4px);
      user-select: none;
    }
    #panel-titulo { margin: 0; font-size: 14px; cursor: pointer; }
    #panel-titulo::after { content: ' ▾'; opacity: 0.6; }
    #panel.plegado #panel-titulo::after { content: ' ▸'; }
    #panel.plegado .seccion { display: none; }
    .seccion { margin-top: 10px; }
    .seccion h3 {
      margin: 0 0 4px; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.65;
    }
    #panel label { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
    #panel input[type=range] { flex: 1; min-width: 0; }
    #panel select, #panel button {
      width: 100%; margin-top: 2px; padding: 4px;
      background: #4a3428; color: inherit; border: 1px solid #6b4a3a; border-radius: 4px;
      font: inherit; cursor: pointer;
    }
    .muestra { display: inline-block; width: 14px; height: 4px; border-radius: 2px; }
    .valor { min-width: 46px; text-align: right; font-variant-numeric: tabular-nums; }

    #capa-leyenda { font-size: 11px; margin-top: 4px; }
    #capa-leyenda .cuadro { margin: 0 6px 0 0; }
    #capa-leyenda i { opacity: 0.55; font-style: normal; float: right; }
    .degradado { height: 8px; border-radius: 3px; }
    .extremos { display: flex; justify-content: space-between; opacity: 0.65; margin-bottom: 2px; }

    /* ---- Panel de métricas (derecha) ---- */
    #metricas {
      position: absolute; top: 12px; right: 12px; width: 290px;
      max-height: calc(100% - 24px); overflow-y: auto; box-sizing: border-box;
      background: rgba(30, 20, 15, 0.78); color: #f3e6d8;
      font: 12px/1.4 system-ui, sans-serif;
      border-radius: 8px; padding: 10px 12px;
      backdrop-filter: blur(4px);
    }
    #metricas-titulo { margin: 0; font-size: 14px; cursor: pointer; user-select: none; }
    #metricas-titulo::after { content: ' ▾'; opacity: 0.6; }
    #metricas.plegado #metricas-titulo::after { content: ' ▸'; }
    #metricas.plegado #metricas-contenido { display: none; }
    .nota { margin: 6px 0 0; font-size: 11px; opacity: 0.6; }
    .kpi-grande { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .kpi-grande div { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .kpi-grande b { font-size: 20px; color: #fff; }
    .kpi-grande span { font-size: 11px; opacity: 0.65; }
    .kpi { margin-top: 4px; }
    .kpi-fila { display: flex; justify-content: space-between; }
    .barra { height: 5px; background: #4a3428; border-radius: 3px; overflow: hidden; margin-top: 2px; }
    .barra div { height: 100%; background: #ffd23f; }
    table.vs { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    table.vs th { font-weight: 600; opacity: 0.65; text-align: right; font-size: 11px; }
    table.vs td { padding: 1px 0; text-align: right; }
    table.vs td:first-child { text-align: left; opacity: 0.8; }
    .bien { color: #6ee08a; }
    .mal { color: #ff7a6b; }
    .marcador { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    .marcador span { width: 105px; flex-shrink: 0; font-size: 11px; }
    .apilada { flex: 1; display: flex; height: 14px; border-radius: 3px; overflow: hidden; font-size: 10px; }
    .apilada div { display: flex; align-items: center; justify-content: center; color: #1e140f; font-weight: 600; }
    .g { background: #6ee08a; }
    .e { background: #a89a8c; }
    .p { background: #ff7a6b; }
    .cuadro { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-left: 4px; }

    /* ---- Ficha de un objetivo (clic en un pin) ---- */
    #ficha {
      position: absolute; transform: translate(-50%, calc(-100% - 8px));
      background: rgba(30, 20, 15, 0.88); color: #f3e6d8;
      font: 12px/1.4 system-ui, sans-serif;
      padding: 8px 10px; border-radius: 6px; border-top: 3px solid #ffd23f;
      pointer-events: none; white-space: nowrap;
    }
    #ficha table { border-collapse: collapse; margin-top: 4px; }
    #ficha td { padding: 1px 0; }
    #ficha td:first-child { opacity: 0.65; padding-right: 10px; }

    /* ---- Avisos (archivos que faltan, etc.) ---- */
    #avisos {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      font: 13px system-ui, sans-serif; color: #fff;
    }
    #avisos div { background: rgba(160, 30, 30, 0.85); padding: 6px 12px; border-radius: 6px; margin-top: 6px; }
  </style>
</head>
<body>
  <canvas id="lienzo"></canvas>

  <div id="panel">
    <h2 id="panel-titulo">Jezero · Marswalk</h2>

    <div class="seccion">
      <h3>Plan</h3>
      <select id="plan">
        <option value="rutas_v2.json">v2 · misión del notebook</option>
        <option value="rutas.json">v1 · prototipo_uno</option>
      </select>
    </div>

    <div class="seccion">
      <h3>Capas</h3>
      <label><input type="checkbox" data-capa="plan" checked>
        <span class="muestra" style="background:#ff3b3b"></span> Nuestro plan</label>
      <label><input type="checkbox" data-capa="real" checked>
        <span class="muestra" style="background:#fff"></span> Ruta real (NASA)</label>
      <label><input type="checkbox" data-capa="objetivos" checked>
        <span class="muestra" style="background:#ffd23f"></span> Objetivos</label>
    </div>

    <div class="seccion">
      <h3>Relieve</h3>
      <label>Exageración
        <input type="range" id="exageracion" min="1" max="6" step="0.5" value="3">
        <span class="valor" id="exageracion-valor">3×</span></label>
    </div>

    <div class="seccion">
      <h3>Capa sobre el terreno</h3>
      <select id="capa">
        <option value="">Ninguna (solo foto CTX)</option>
        <option value="crism">Minerales (CRISM)</option>
        <option value="costo">Mapa de costos</option>
      </select>
      <label>Opacidad
        <input type="range" id="capa-opacidad" min="0.1" max="1" step="0.05" value="0.8">
        <span class="valor" id="capa-opacidad-valor">80 %</span></label>
      <div id="capa-leyenda"></div>
    </div>

    <div class="seccion">
      <h3>Rover</h3>
      <label>Velocidad
        <input type="range" id="velocidad" min="0" max="1500" step="50" value="300">
        <span class="valor" id="velocidad-valor">300 m/s</span></label>
      <label><input type="checkbox" id="seguir"> Cámara sigue al rover</label>
      <button id="pausa">⏸ Pausa</button>
    </div>

    <div class="seccion">
      <h3>Navegación autónoma</h3>
      <label><input type="checkbox" id="replaneo"> Simular peligro en la ruta</label>
      <label><span class="muestra" style="background:#ff8c1a"></span> Peligro
        <span class="muestra" style="background:#2ee6ff"></span> Desvío</label>
      <p class="nota" id="replaneo-info">Solo con el plan v2.</p>
    </div>
  </div>

  <div id="metricas">
    <h2 id="metricas-titulo">Métricas</h2>
    <div id="metricas-contenido"><p class="nota">Cargando…</p></div>
  </div>

  <div id="ficha" hidden></div>
  <div id="avisos"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
